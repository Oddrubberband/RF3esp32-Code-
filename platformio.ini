; RF3 reproducible build environments. The two canonical firmware targets
; select distinct, compile-time checked hardware profiles while preserving the
; same nRF24 physical-layer settings.

[platformio]
default_envs = rf3_custom_pcb

[rf3_firmware]
platform = platformio/espressif32@7.0.1
framework = espidf
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:tools/platformio_file_targets.py
board_build.filesystem = spiffs
build_flags =
    -DRF3_WIFI_CONTROL_ENABLED=0
    -DRF3_TRANSFER_RATE_LIMIT_BPS=0
    -DRF3_NRF24_TX_CE_PULSE_US=40
    -DNRF24_SCK_PIN=18
    -DNRF24_MOSI_PIN=23
    -DNRF24_MISO_PIN=19

[env:rf3_custom_pcb]
extends = rf3_firmware
board = esp32wroom32d_n16
board_build.partitions = partitions.csv
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.rf3_custom_pcb
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset
build_flags =
    ${rf3_firmware.build_flags}
    -DRF3_HARDWARE_PROFILE_ID=1
    -DRF3_NODE_NAME=\"rf3-pcb\"
    -DNRF24_CE_PIN=17
    -DNRF24_CSN_PIN=5
    -DNRF24_IRQ_PIN=27

[env:rf3_esp32_devboard]
extends = rf3_firmware
board = esp32wroom32d_4mb
board_build.partitions = partitions_4mb.csv
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.rf3_esp32_devboard
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.devboard.defaults"
build_flags =
    ${rf3_firmware.build_flags}
    -DRF3_HARDWARE_PROFILE_ID=2
    -DRF3_NODE_NAME=\"rf3-devboard\"
    -DNRF24_CE_PIN=27
    -DNRF24_CSN_PIN=5
    -DNRF24_IRQ_PIN=26

; Compatibility aliases retained for existing local commands.
[env:esp32wroom32d]
extends = env:rf3_custom_pcb

[env:esp32wroom32d_manual_boot]
extends = env:rf3_custom_pcb

[env:esp32wroom32d_devboard]
extends = env:rf3_esp32_devboard

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<audio_packet.cpp>
    +<audio_reassembler.cpp>
    +<nrf24.cpp>
    +<radio_manager.cpp>
    +<frame_io.cpp>
    +<morse.cpp>
    +<validation.cpp>

name: Build and package R28 field firmware

on:
  push:
    branches: [main]
    paths:
      - 'boards/custom-pcb-sense/**'
      - 'boards/devboard-ebyte/**'
      - 'build_boards.py'
      - '.github/workflows/field-firmware-r28.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check tracked source
        run: python tools/check_repository_hygiene.py
      - name: Run Reliable transfer and diagnostics tests
        run: |
          for board in custom-pcb-sense devboard-ebyte; do
            for test in test_resume_runtime test_diagnostics_runtime; do
              python "boards/$board/tools/tests/$test.py" --compiler g++ --output "$RUNNER_TEMP/$board/$test"
            done
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic -DEXPECT_EARLY_RETRY \
              -I "boards/$board/include" boards/custom-pcb-sense/tools/tests/early_ack_retry.cpp \
              -o "$RUNNER_TEMP/early-ack"
            "$RUNNER_TEMP/early-ack"
          done
      - name: Build both boards and validate the staged images
        run: python build_boards.py --build
      - name: Assemble paired firmware and source ZIPs
        run: |
          mkdir -p release
          git archive --format=zip --prefix=RF3-R28/ --output=release/RF3-R28-Board-Source.zip \
            HEAD -- START_HERE.md Build_Both.cmd build_boards.py boards/custom-pcb-sense boards/devboard-ebyte
          zip -q -r release/RF3-R28-Firmware.zip START_HERE.md \
            boards/custom-pcb-sense/Flash_Custom_PCB.cmd boards/custom-pcb-sense/Flash_Manual.ps1 \
            boards/custom-pcb-sense/Firmware_Images.json boards/custom-pcb-sense/firmware \
            boards/devboard-ebyte/Flash_Devboard.cmd boards/devboard-ebyte/Flash_Manual.ps1 \
            boards/devboard-ebyte/Firmware_Images.json boards/devboard-ebyte/firmware
          cd release
          unzip -tq RF3-R28-Board-Source.zip
          unzip -tq RF3-R28-Firmware.zip
          sha256sum RF3-R28-Board-Source.zip RF3-R28-Firmware.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RF3-R28-field-firmware
          path: release/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: RF3-R28-field-firmware
          path: release
      - name: Publish R28 as a bench prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          if gh release view v2026.11.25-field-r28 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The R28 prerelease is already published."
            exit 0
          fi
          cat > "$RUNNER_TEMP/r28-notes.md" <<'EOF'
          R28 includes the R25 Bluetooth file-stack fix, the R26 custom RX LNA opt-in, the R27 Reliable receive recovery, and the R28 expedited DATA retry after a run of prompt ACKs.

          Download **RF3-R28-Firmware.zip**, extract it, and use the matching manual flash launcher. The build IDs are **RF3-R28-CUSTOM** for the 16 MB custom PCB and **RF3-R28-EBYTE** for the 4 MB USB ESP32 devboard with EBYTE SPI radio. **RF3-R28-Board-Source.zip** is the editable PlatformIO source kit.

          Use [RF3 Field Desktop R24 for Windows](https://github.com/Oddrubberband/RF3esp32-Code-/releases/tag/v2026.11.24-field-r24).

          Both images passed software build and packaging checks. R28 over-the-air performance and the custom FEM TX fault still require bench verification.
          EOF
          gh release create v2026.11.25-field-r28 \
            RF3-R28-Firmware.zip RF3-R28-Board-Source.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RF3 R28 Field Firmware" --notes-file "$RUNNER_TEMP/r28-notes.md" \
            --prerelease --latest=false

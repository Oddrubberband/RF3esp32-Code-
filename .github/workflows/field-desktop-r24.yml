name: Release RF3 Field Desktop R24
on:
  push:
    branches: [release/field-desktop-r24]
    paths: ['field-desktop/**', '.github/workflows/field-desktop-r24.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: field-desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r host_gui/requirements.txt
      - name: Run desktop tests
        working-directory: field-desktop/host_gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm RF3Desktop.spec
      - name: Verify ZIP and start extracted app in serial and Practice modes
        run: python package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RF3-Field-R24-publication
          path: field-desktop/release/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RF3-Field-R24-publication
          path: release
      - name: Publish verified Windows ZIP
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          cat > "$RUNNER_TEMP/field-release.md" <<'EOF'
          Download **RF3-Field-R24-Windows-x64.zip**, extract the entire ZIP, and open **RF3Desktop.exe**. Keep the `_internal` folder beside it. Python is not required.

          Connect the board by USB and select its COM port. Run **Practice.cmd** to try the app without hardware.

          R24 fixes receive-attempt tracking, delivery CSV handling, serial error recovery, and Practice mode. Create-only SPIFFS import and scoped cancellation errors require R24 firmware. This release contains the Windows desktop app.
          EOF
          gh release create v2026.11.24-field-r24 RF3-Field-R24-Windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RF3 Field Desktop R24 for Windows x64" --notes-file "$RUNNER_TEMP/field-release.md" --latest=false

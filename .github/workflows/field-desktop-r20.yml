name: Release RF3 Field Desktop R20
on:
  push:
    branches: [release/field-desktop-r20]
    paths: ['field-desktop/**', '.github/workflows/field-desktop-r20.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: field-desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r host_gui/requirements.txt
      - name: Run desktop tests
        working-directory: field-desktop/host_gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm RF3Desktop.spec
      - name: Verify ZIP and start extracted app in serial and practice modes
        run: python package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RF3-Field-R20-publication
          path: field-desktop/release/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RF3-Field-R20-publication
          path: release
      - name: Publish verified Windows ZIP
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          cat > "$RUNNER_TEMP/field-release.md" <<'EOF'
          Download **RF3-Field-R20-Windows-x64.zip**, extract the entire ZIP, and open **RF3Desktop.exe**. Keep the extracted files together. No Python installation is required.

          For a physical board, select its USB COM port and connect. Open **Practice.cmd** for a hardware-free preview. This version includes file and peer delivery reporting and displays the custom ESP PCB's latest 1-second battery reading and 4-interval average with sensing firmware RF3-SENSE-C1-20261123.
          EOF
          gh release create v2026.11.23-field-r20 RF3-Field-R20-Windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RF3 Field Desktop R20 for Windows x64" --notes-file "$RUNNER_TEMP/field-release.md" --latest=false

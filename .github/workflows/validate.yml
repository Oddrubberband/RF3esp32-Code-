name: Validate and package current RF3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish current release after every check passes
        type: boolean
        default: false
        required: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux:
    name: Native, production contracts and both firmware builds
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned firmware tooling
        run: python -m pip install -r requirements.txt
      - name: Check source hygiene
        run: python tools/check_repository_hygiene.py
      - name: Native RF protocol and HAL tests
        run: python -m platformio test -e native
      - name: Python host and release tooling tests
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Strict native host helper fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-native
          for source in host_connection_protocol host_status_protocol host_storage_protocol host_transfer_protocol host_transport_safety; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread -I include "tools/tests/$source.cpp" -o ".ci-native/$source"
            ".ci-native/$source"
          done
      - name: Actual production status and encoded-command contract, both profiles
        run: python tools/tests/test_host_runtime_contract.py --output .ci-native/runtime
      - name: Actual production incoming RX command guards, both profiles
        run: python tools/tests/test_rx_command_guard.py --output .ci-native/rx
      - name: Actual production extension codec and receive publication, both profiles
        run: python tools/tests/test_file_type_metadata.py --output .ci-native/extensions
      - name: Build both matching firmware profiles
        run: python -m platformio run -e rf3_custom_pcb -e rf3_esp32_devboard
      - name: Package verified firmware images
        run: python tools/package_current_release.py --kind firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rf3-release-firmware
          path: |
            release-dist/RF3-Firmware.zip
            release-dist/FIRMWARE-BUILD.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows GUI regression suite and portable desktop
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: host_gui/requirements.txt
      - name: Install pinned GUI and packaging dependencies
        run: python -m pip install -r host_gui/requirements.txt
      - name: GUI regression tests (hardware-free)
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'host_gui'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:TEMP = Join-Path $env:RUNNER_TEMP 'rf3-gui-tests'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          python -m unittest discover -s host_gui/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the complete portable GUI
        run: python -m PyInstaller --noconfirm --clean RF3Desktop.spec
      - name: Package Windows desktop
        run: python tools/package_current_release.py --kind gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rf3-release-windows
          path: |
            release-dist/RF3-Desktop-Windows.zip
            release-dist/GUI-BUILD.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified current release
    needs: [linux, windows]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release-current]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: rf3-current-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rf3-release-*
          path: release-dist
          merge-multiple: true
      - name: Verify source commit, hashes and archive contents; publish draft only after uploaded checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RF3_RELEASE_AUTHORIZED: 'true'
        run: python tools/publish_current_release.py --publish

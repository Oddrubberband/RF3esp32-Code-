name: No-ACK bench pair
on:
  push:
    branches: ['bench/noack-gap-recovery-r1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Build both firmware profiles and validate images
        run: |
          unzip -q bench-noack/candidate-source.zip -d bench-stage
          python bench-stage/pack_images.py --build
      - name: Package source and manual flash images
        run: |
          cd bench-stage
          zip -qr ../RF3_NoACK_Bench_R1.zip . -x '*/.pio/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RF3-NoACK-Bench-R1
          path: RF3_NoACK_Bench_R1.zip
          if-no-files-found: error

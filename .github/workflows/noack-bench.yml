name: Build no-ACK recovery bench pair
on:
  push:
    branches: [test/noack-recovery-r1-20261123]
    paths: ['bench/**', '.github/workflows/noack-bench.yml']
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Compile both profiles and validate image digests, IDs and partitions
        working-directory: bench
        run: python pack_images.py --build
      - name: Package installers and firmware
        working-directory: bench
        run: python make_bench_zip.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RF3-NoACK-Recovery-R1-Board-Pair
          path: bench/flash-kit/
          if-no-files-found: error
          retention-days: 90
